function parseCSV(txt){
 const lines=txt.replace(/^\uFEFF/,"").split(/\r?\n/).filter(Boolean); if(lines.length<2)return [];
 const sep=(lines[0].split(';').length>lines[0].split(',').length)?';':',';
 const split=l=>{let a=[],v='',q=false;for(let i=0;i<l.length;i++){let c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){v+='"';i++}else q=!q}else if(c===sep&&!q){a.push(v.trim());v=''}else v+=c}a.push(v.trim());return a};
 const h=split(lines[0]).map(x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase());
 const ix=n=>h.indexOf(n); return lines.slice(1).map(l=>{let c=split(l);return {node:c[ix('node')]||'',score:Number((c[ix('pontuacao')]||'').replace(',','.')),impactado:Number(c[ix('impactado')]||0),estressado:Number(c[ix('estressado')]||0),total:Number(c[ix('total')]||0)}}).filter(x=>x.node);
}
function baseNode(port){return port.replace(/-\d+$/,'')}
function applyRows(rows){
 data=geoData.map(x=>({...x,score_avg:null,impactado:0,estressado:0,total:0,ports:[],n:0}));
 const byNode=new Map(data.map(x=>[x.node,x])); const byGeo=new Map(data.map(x=>[x.geo_source,x]));
 for(const r of rows){let b=baseNode(r.node), t=byNode.get(b)||byGeo.get(b);

   if(!t)continue; t.ports.push(r);t.n++;t.impactado+=r.impactado;t.estressado+=r.estressado;t.total+=r.total;
 }
 data.forEach(x=>{if(x.n)x.score_avg=Math.round((x.ports.reduce((a,p)=>a+(Number.isFinite(p.score)?p.score:0),0)/x.n)*10)/10});

}
async function loadDrive(){
 const st=document.getElementById('sourceStatus');
 if(!CONFIG.DRIVE_CSV_URL){st.textContent='aguardando link da pasta/arquivo compartilhado';st.className='err';return;}
 try{let r=await fetch(CONFIG.DRIVE_CSV_URL+'&v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let txt=await r.text();let rows=parseCSV(txt);if(!rows.length)throw new Error('CSV vazio ou formato inválido');applyRows(rows);localStorage.setItem('rg_last_csv',txt);st.textContent='Drive atualizado • '+new Date().toLocaleString('pt-BR');st.className='ok'}
 catch(e){let old=localStorage.getItem('rg_last_csv');if(old){applyRows(parseCSV(old));st.textContent='Drive indisponível • exibindo última coleta válida';st.className='err'}else{st.textContent='não foi possível carregar a coleta do Drive';st.className='err'}}
}
